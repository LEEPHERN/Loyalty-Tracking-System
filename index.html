<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Stamp Levels</title>
<style>
  :root {
    --bg: #FAF3EB;
    --card: #FFFFFF;
    --brown: #6F4E37;
    --latte: #A9714B;
    --tan: #D9B99B;
    --cream: #F3E6D8;
    --text: #3E2E22;
    --muted: #8A7461;
    --green: #4E7A4E;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header.app-header { text-align: center; padding: 18px 0 8px; }
  header.app-header h1 { font-size: 1.7rem; color: var(--brown); letter-spacing: 0.5px; }
  header.app-header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }
  .coffee-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--latte); margin-right: 8px; vertical-align: middle; }

  section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 2px 8px rgba(111, 78, 55, 0.08);
  }
  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* Mode switch */
  .mode-buttons { display: flex; gap: 12px; }
  .mode-buttons button {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: var(--radius);
    border: 2px solid var(--tan);
    background: var(--cream);
    color: var(--brown);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .mode-buttons button:hover { border-color: var(--latte); }
  .mode-buttons button.active {
    background: var(--brown);
    border-color: var(--brown);
    color: #FFF7EE;
  }

  /* Search */
  .search-box { position: relative; margin: 6px 0 16px; }
  .search-box input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    font-size: 1rem;
    border: 2px solid var(--tan);
    border-radius: 10px;
    background: var(--cream);
    color: var(--text);
    outline: none;
  }
  .search-box input:focus { border-color: var(--latte); background: #fff; }
  .search-box .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 1rem;
  }
  .hint { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }

  /* Customer cards */
  .cust-card {
    border: 1px solid var(--cream);
    background: #FFFDF9;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
  }
  .cust-card .head {
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px;
  }
  .cust-card .name { font-weight: 700; font-size: 1.05rem; }
  .cust-card .phone { color: var(--muted); font-size: 0.9rem; }
  .level-badge {
    display: inline-block;
    background: var(--latte);
    color: #FFF7EE;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 8px;
  }
  .stamps-row { display: flex; gap: 8px; margin: 14px 0 10px; flex-wrap: wrap; }
  .stamp {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px dashed var(--tan);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; color: var(--tan);
  }
  .stamp.filled { background: var(--brown); border: 2px solid var(--brown); color: #FFF7EE; }

  .progress-track {
    height: 12px; background: var(--cream); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--latte), var(--brown));
    border-radius: 999px; transition: width 0.3s ease;
  }
  .progress-text { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
  .next-level { margin-top: 10px; font-size: 0.9rem; color: var(--brown); }
  .next-level strong { color: var(--latte); }
  .reward-note { margin-top: 8px; font-size: 0.85rem; color: var(--green); font-weight: 600; }

  /* Owner view */
  .owner-list .cust-card { cursor: pointer; transition: border-color 0.15s; }
  .owner-list .cust-card:hover { border-color: var(--tan); }
  .owner-list .cust-card.selected { border: 2px solid var(--latte); background: #FFF7EE; }
  .mini-stamps { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .owner-actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn-stamp {
    background: var(--brown); color: #FFF7EE;
    border: none; border-radius: 10px;
    padding: 12px 22px; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .btn-stamp:hover { background: #5C3F2B; }
  .selected-detail {
    border: 2px solid var(--tan);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    background: #FFFDF9;
  }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--brown); color: #FFF7EE;
    padding: 12px 22px; border-radius: 10px;
    font-size: 0.95rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; }
  .empty-note { color: var(--muted); font-style: italic; padding: 8px 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1><span class="coffee-dot"></span>Coffee Stamp Levels</h1>
    <p>Kopi Kenangan Senja &mdash; loyalty stamp card tracker (sample data)</p>
  </header>

  <!-- 1. Mode Switch -->
  <section id="mode-section" aria-label="Mode switch">
    <div class="section-label">1 &middot; Who's using this?</div>
    <div class="mode-buttons">
      <button id="btn-customer" class="active" onclick="setMode('customer')">Customer View</button>
      <button id="btn-owner" onclick="setMode('owner')">Owner View</button>
    </div>
  </section>

  <!-- 2. Customer View -->
  <section id="customer-section" aria-label="Customer view">
    <div class="section-label">2 &middot; Check your card</div>
    <div class="search-box">
      <span class="icon">&#128269;</span>
      <input id="cust-search" type="text" placeholder="Search by name or phone number..." oninput="renderCustomerView()">
    </div>
    <div class="hint">Try &ldquo;Nurul&rdquo; or &ldquo;012&rdquo;</div>
    <div id="cust-results"></div>
  </section>

  <!-- 3. Owner View -->
  <section id="owner-section" style="display:none" aria-label="Owner view">
    <div class="section-label">3 &middot; Owner tools</div>
    <div class="search-box">
      <span class="icon">&#128269;</span>
      <input id="owner-search" type="text" placeholder="Search by name or phone number..." oninput="renderOwnerView()">
    </div>
    <div class="hint">Tap a customer to select, then add a stamp.</div>
    <div id="owner-list" class="owner-list"></div>
    <div id="owner-detail"></div>
  </section>

  <footer>Sample data only &mdash; nothing is saved between visits.</footer>
</div>
<div id="toast" class="toast"></div>

<script>
  const STAMPS_PER_LEVEL = 6;
  const LEVELS = ["Kopi O", "Cappuccino", "Latte", "Barista's Choice"];

  // Example entries (made up, specific to Malaysia)
  let customers = [
    { name: "Nurul Aisyah",  phone: "012-345 6789", stamps: 4 },
    { name: "Ahmad Faizal",  phone: "013-987 6543", stamps: 6 },
    { name: "Siti Halimah",  phone: "019-222 3344", stamps: 2 }
  ];

  let mode = "customer";
  let selectedOwnerIndex = null;

  function levelIndex(stamps) {
    const i = Math.floor(stamps / STAMPS_PER_LEVEL);
    return Math.min(i, LEVELS.length - 1);
  }
  function stampsIntoLevel(stamps) { return stamps % STAMPS_PER_LEVEL; }
  function nextLevelInfo(stamps) {
    const li = levelIndex(stamps);
    if (li >= LEVELS.length - 1) return null; // top level
    return { name: LEVELS[li + 1], remaining: STAMPS_PER_LEVEL - stampsIntoLevel(stamps) };
  }

  function matches(c, q) {
    if (!q) return true;
    q = q.toLowerCase().replace(/[\s-]/g, "");
    return c.name.toLowerCase().includes(q) ||
           c.phone.replace(/[\s-]/g, "").toLowerCase().includes(q);
  }

  function stampDots(stamps) {
    const inLevel = stampsIntoLevel(stamps);
    let html = '<div class="stamps-row">';
    for (let i = 0; i < STAMPS_PER_LEVEL; i++) {
      html += '<div class="stamp' + (i < inLevel ? ' filled' : '') + '">' + (i < inLevel ? '&#9749;' : i + 1) + '</div>';
    }
    return html + '</div>';
  }

  function progressBar(stamps) {
    const inLevel = stampsIntoLevel(stamps);
    const pct = Math.round(inLevel / STAMPS_PER_LEVEL * 100);
    const nl = nextLevelInfo(stamps);
    let next = nl
      ? 'Next level: <strong>' + nl.name + '</strong> &mdash; ' + nl.remaining + ' more stamp' + (nl.remaining === 1 ? '' : 's')
      : 'You are at the top level: <strong>' + LEVELS[LEVELS.length - 1] + '</strong>!';
    return '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
           '<div class="progress-text"><span>' + inLevel + ' / ' + STAMPS_PER_LEVEL + ' stamps this level</span><span>' + pct + '%</span></div>' +
           '<div class="next-level">' + next + '</div>' +
           (stampsIntoLevel(stamps) === 0 && stamps > 0
             ? '<div class="reward-note">&#127881; Level reached &mdash; enjoy a free drink on us! (sample)</div>'
             : '');
  }

  function cardHTML(c, idx, forOwner) {
    const li = levelIndex(c.stamps);
    return '<div class="cust-card' + (forOwner && selectedOwnerIndex === idx ? ' selected' : '') + '"' +
           (forOwner ? ' onclick="selectCustomer(' + idx + ')"' : '') + '>' +
           '<div class="head"><div><span class="name">' + c.name + '</span><br><span class="phone">' + c.phone + '</span></div>' +
           '<span class="level-badge">Level ' + (li + 1) + ' &middot; ' + LEVELS[li] + '</span></div>' +
           stampDots(c.stamps) + progressBar(c.stamps) +
           (forOwner ? '<div class="mini-stamps">Total stamps: ' + c.stamps + '</div>' : '') +
           '</div>';
  }

  function renderCustomerView() {
    const q = document.getElementById("cust-search").value;
    const list = customers.filter(c => matches(c, q));
    const el = document.getElementById("cust-results");
    if (list.length === 0) {
      el.innerHTML = '<div class="empty-note">No card found for that name or number. Check the spelling and try again.</div>';
    } else {
      el.innerHTML = list.map(c => cardHTML(c, customers.indexOf(c), false)).join("");
    }
  }

  function renderOwnerView() {
    const q = document.getElementById("owner-search").value;
    const list = customers.filter(c => matches(c, q));
    const listEl = document.getElementById("owner-list");
    if (list.length === 0) {
      listEl.innerHTML = '<div class="empty-note">No customer matches that search.</div>';
    } else {
      listEl.innerHTML = list.map(c => cardHTML(c, customers.indexOf(c), true)).join("");
    }
    renderOwnerDetail();
  }

  function renderOwnerDetail() {
    const el = document.getElementById("owner-detail");
    if (selectedOwnerIndex === null || !customers[selectedOwnerIndex]) {
      el.innerHTML = '<div class="empty-note">Select a customer above to add stamps.</div>';
      return;
    }
    const c = customers[selectedOwnerIndex];
    const li = levelIndex(c.stamps);
    const nl = nextLevelInfo(c.stamps);
    el.innerHTML = '<div class="selected-detail">' +
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">' +
      '<div><span class="name">' + c.name + '</span><br><span class="phone">' + c.phone + '</span></div>' +
      '<span class="level-badge">Level ' + (li + 1) + ' &middot; ' + LEVELS[li] + '</span></div>' +
      '<div class="mini-stamps">Current stamps: <strong>' + c.stamps + '</strong>' +
      (nl ? ' &middot; Next level: ' + nl.name : ' &middot; Top level reached') + '</div>' +
      '<div class="owner-actions"><button class="btn-stamp" onclick="addStamp()">+ Add one stamp</button></div>' +
      '</div>';
  }

  function setMode(m) {
    mode = m;
    document.getElementById("btn-customer").classList.toggle("active", m === "customer");
    document.getElementById("btn-owner").classList.toggle("active", m === "owner");
    document.getElementById("customer-section").style.display = m === "customer" ? "" : "none";
    document.getElementById("owner-section").style.display = m === "owner" ? "" : "none";
  }

  function selectCustomer(idx) {
    selectedOwnerIndex = idx;
    renderOwnerView();
  }

  function addStamp() {
    if (selectedOwnerIndex === null) return;
    const c = customers[selectedOwnerIndex];
    c.stamps++;
    const li = levelIndex(c.stamps);
    toast("Added 1 stamp for " + c.name + " \u2014 now " + c.stamps +
          (c.stamps % STAMPS_PER_LEVEL === 0 ? " \u2014 Level up: " + LEVELS[li] + "! \u{1F389}" : ""));
    renderOwnerView();
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // Initial render — the app is never empty
  renderCustomerView();
  renderOwnerView();
</script>
</body>
</html>
